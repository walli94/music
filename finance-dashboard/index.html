<title>ClubLife Finance</title>
<meta name="description" content="ClubLife OS · Finanzen: Einnahmen, Ausgaben, Ergebnis und Jahresvergleich">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* ClubLife brand — dark only, like ClubLife OS & decks */
:root{
  color-scheme: dark;
  --bg:#000; --side:#060606; --surface:#0a0a0a; --surface-2:#141414; --line:#1f1f22; --line-2:#2a2a2e;
  --ink:#fff; --ink-2:#a1a1aa; --ink-3:#71717a;
  --accent:#ff5c5c; --accent-soft:rgba(255,92,92,.12);
  --brand-line:linear-gradient(90deg,#ff5c5c,rgba(255,92,92,.3) 60%,rgba(255,92,92,0));
  --s-in:#f55252; --s-out:#6d64f2;
  --good:#22c55e; --good-soft:rgba(34,197,94,.12);
  --warn:#f5a524; --warn-soft:rgba(245,165,36,.12);
  --bad:#ff5c5c; --bad-soft:rgba(255,92,92,.13);
  --r:14px;
  --f-display:"Poppins","Inter",system-ui,sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;font-feature-settings:"cv11" 1}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}

/* ---------- App shell ---------- */
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100%;background:linear-gradient(90deg,var(--side) 239px,var(--line) 239px,var(--line) 240px,var(--bg) 240px)}
.side{position:sticky;top:0;height:100vh;background:var(--side);border-right:1px solid var(--line);align-self:start;display:flex;flex-direction:column;gap:6px;padding:22px 14px}
.brand{display:flex;align-items:center;gap:11px;padding:0 8px 22px}
.logo{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,#ff5c5c,#c93636);box-shadow:0 8px 24px -8px rgba(255,92,92,.7);flex:none}
.logo svg{width:19px;height:19px}
.brand b{display:block;font-family:var(--f-display);font-weight:800;font-size:16px;line-height:1.1;white-space:nowrap}
.brand b span{color:var(--accent)}
.brand small{display:block;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin-top:2px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:11px;border:0;background:none;padding:10px 12px;border-radius:10px;cursor:pointer;color:var(--ink-2);font-weight:500;font-size:14px;text-align:left;position:relative}
.nav button svg{width:18px;height:18px;flex:none}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--ink);font-weight:600}
.nav button[aria-current="page"]::before{content:"";position:absolute;left:-14px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
.nav button[aria-current="page"] svg{color:var(--accent)}
.side .grow{flex:1}
.ebbox{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface);display:flex;flex-direction:column;gap:9px}
.eb{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-2)}
.eb i{width:7px;height:7px;border-radius:50%;background:var(--ink-3);flex:none}
.eb.ok i{background:var(--good);box-shadow:0 0 0 3px var(--good-soft)}
.eb.busy i{background:var(--accent);animation:pulse 1s infinite}
.eb.warn i{background:var(--warn)}
.eb.err i{background:var(--bad)}
@keyframes pulse{50%{opacity:.35}}
.ebbox button{border:1px solid var(--line-2);background:var(--surface-2);border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;cursor:pointer}
.ebbox button:hover{border-color:var(--accent)}
.ebbox button:disabled{opacity:.5;cursor:default}

.main{min-width:0;padding-inline:clamp(16px,3vw,40px);padding-block:26px 64px;max-width:1240px;width:100%}
.head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px 20px;margin-bottom:22px}
.head h1{margin:0;font-family:var(--f-display);font-weight:800;font-size:clamp(22px,2.6vw,28px);letter-spacing:-.02em}
.head p{margin:2px 0 0;color:var(--ink-3);font-size:13px}
.period{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.stepper{display:flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px}
.stepper button{background:none;border:0;width:32px;height:32px;border-radius:999px;cursor:pointer;color:var(--ink-2);display:grid;place-items:center}
.stepper button:hover{background:var(--surface-2);color:var(--ink)}
.stepper .label{min-width:130px;text-align:center;font-weight:600;font-size:13.5px}
select.sel{background:var(--surface);border:1px solid var(--line-2);border-radius:10px;padding:8px 12px;font-weight:600}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px;gap:2px}
.seg button{border:0;background:none;padding:6px 13px;border-radius:999px;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface-2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line-2)}

.msg{font-size:13px;color:var(--ink-2);padding:11px 14px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface);margin-bottom:16px}
.msg b{color:var(--ink)}

/* ---------- Cards ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.card::before{content:"";position:absolute;inset:0 0 auto 0;height:2px;border-radius:var(--r) var(--r) 0 0;background:var(--brand-line);pointer-events:none}
.kpi{padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.kpi .k{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--ink-3);display:flex;align-items:center;gap:7px}
.kpi .k i{width:8px;height:8px;border-radius:2px}
.kpi .v{font-family:var(--f-display);font-weight:800;font-size:clamp(22px,2.3vw,29px);letter-spacing:-.02em;line-height:1.15;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s{font-size:12px;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.neutral{background:var(--surface-2);color:var(--ink-2)}
.pos{color:var(--good)} .neg{color:var(--bad)}

.panel{margin-bottom:14px}
.ph{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px 0}
.ph h2{margin:0;font-family:var(--f-display);font-weight:700;font-size:15px}
.ph .sub{font-size:12px;color:var(--ink-3);margin-top:1px}
.pb{padding:14px 18px 18px}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.accs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0}
.acc{padding:16px 18px;display:flex;flex-direction:column;gap:6px;min-width:0;border-left:1px solid var(--line)}
.acc:first-child{border-left:0}
.acc .k{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--ink-3);display:flex;align-items:center;justify-content:space-between;gap:8px}
.acc .v{font-family:var(--f-display);font-weight:800;font-size:clamp(20px,2vw,26px);letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acc .s{font-size:12px;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.acc.total{background:linear-gradient(160deg,rgba(255,92,92,.10),transparent 70%)}
.acc .upd{border:1px solid var(--line-2);background:var(--surface-2);border-radius:8px;padding:3px 9px;font-size:11.5px;font-weight:600;cursor:pointer;letter-spacing:0;text-transform:none;color:var(--ink)}
.acc .upd:hover{border-color:var(--accent)}
@media (max-width:760px){.accs{grid-template-columns:1fr}.acc{border-left:0;border-top:1px solid var(--line)}.acc:first-child{border-top:0}}
.strip{display:flex;flex-wrap:wrap;gap:8px 26px;padding:12px 18px;font-size:13px;color:var(--ink-2)}
.strip b{color:var(--ink);font-variant-numeric:tabular-nums;font-weight:700}

/* chart */
.chart{position:relative;overflow-x:auto}
.chart svg{display:block;width:100%;min-width:560px;height:auto}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .zero{stroke:var(--line-2);stroke-width:1}
.chart .tick{fill:var(--ink-3);font-size:10px;font-variant-numeric:tabular-nums}
.chart .tick.sel{fill:var(--ink);font-weight:700}
.chart .hit{fill:transparent;cursor:pointer}
.chart .hit:hover,.chart .hit.sel{fill:rgba(255,255,255,.04)}
.tip{position:absolute;pointer-events:none;background:#111;border:1px solid var(--line-2);border-radius:10px;padding:10px 12px;font-size:12px;min-width:200px;box-shadow:0 16px 30px -12px rgba(0,0,0,.8);opacity:0;transition:opacity .12s;z-index:5}
.tip.on{opacity:1}
.tip .t{font-weight:700;margin-bottom:6px}
.tip .r{display:flex;justify-content:space-between;gap:14px;color:var(--ink-2)}
.tip .r b{color:var(--ink);font-variant-numeric:tabular-nums}
.tip .r i{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:6px}

/* lists & tables */
.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:10px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .m{font-size:12px;color:var(--ink-3);grid-column:1}
.li .a{font-weight:700;font-variant-numeric:tabular-nums;grid-row:1/3;grid-column:2;align-self:center}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--ink-3);font-weight:600;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line-2);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tfoot td{border-top:1px solid var(--line-2);border-bottom:0;font-weight:700}
.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td .meta{font-size:11.5px;color:var(--ink-3)}
tr.off td{opacity:.45}
tr.sep td{padding:14px 10px 6px;font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--ink-3);font-weight:700;border-bottom:1px solid var(--line-2)}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line);white-space:nowrap}
.tag.src{color:#ff8a8a;border-color:rgba(255,92,92,.35);background:var(--accent-soft)}
.act{display:flex;gap:4px;justify-content:flex-end}
.ibtn{border:1px solid transparent;background:none;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;cursor:pointer;color:var(--ink-3)}
.ibtn:hover{background:var(--surface-2);color:var(--ink);border-color:var(--line)}
.ibtn svg{width:15px;height:15px}
.empty{padding:28px 12px;text-align:center;color:var(--ink-3);font-size:13px;line-height:1.6}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-2);background:var(--surface-2);padding:8px 14px;border-radius:10px;cursor:pointer;font-weight:600;font-size:13px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#0a0a0a;font-weight:700}
.btn.danger{background:none;color:var(--bad)}
.btn svg{width:15px;height:15px}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);z-index:20;opacity:0;pointer-events:none;transition:opacity .18s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--surface);border-left:1px solid var(--line-2);z-index:21;transform:translateX(102%);transition:transform .22s ease;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer.on{transform:none}
.drawer header{padding:20px 22px 8px;display:flex;justify-content:space-between;align-items:center}
.drawer h3{margin:0;font-family:var(--f-display);font-weight:700;font-size:17px}
.drawer form{padding:8px 22px 22px;display:flex;flex-direction:column;gap:14px;overflow:auto;flex:1}
.fld{display:flex;flex-direction:column;gap:6px}
.fld label{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--ink-3);font-weight:600}
.fld input,.fld select{background:#050505;border:1px solid var(--line-2);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
.fld input:focus,.fld select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.fld .hint{font-size:11.5px;color:var(--ink-3)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.check{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink-2)}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.drawer footer{padding:14px 22px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:space-between;align-items:center}
.err{color:var(--bad);font-size:12.5px}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:#fff;color:#000;padding:10px 16px;border-radius:10px;font-weight:600;font-size:13px;opacity:0;transition:.18s;z-index:30;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:1000px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.cols{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr);background:var(--bg)}
  .side{position:sticky;top:0;height:auto;z-index:10;flex-direction:row;align-items:center;flex-wrap:wrap;gap:8px;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0px));border-right:0;border-bottom:1px solid var(--line)}
  .brand{padding:0;flex:1}
  .brand small{display:none}
  .nav{order:3;flex-direction:row;width:100%;overflow-x:auto;gap:4px}
  .nav button{padding:8px 11px;font-size:13px;white-space:nowrap}
  .nav button[aria-current="page"]::before{display:none}
  .side .grow{display:none}
  .ebbox{flex-direction:row;align-items:center;padding:6px 8px;border-radius:999px}
  .ebbox .eb span{display:none}
  .two{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M4 16v-3M9 19V8M14 17v-6M19 20V4"/></svg></div>
      <div><b>ClubLife <span>OS</span></b><small>Finanzen</small></div>
    </div>
    <nav class="nav" aria-label="Bereiche">
      <button data-view="overview"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>Übersicht</button>
      <button data-view="income"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>Einnahmen</button>
      <button data-view="expenses"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M19 12l-7 7-7-7"/></svg>Ausgaben</button>
      <button data-view="compare"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/></svg>Jahresvergleich</button>
    </nav>
    <div class="grow"></div>
    <div class="ebbox">
      <div class="eb" id="eb"><i></i><span class="t">Easybill …</span></div>
      <button id="ebSync" type="button">Mit Easybill abgleichen</button>
    </div>
  </aside>

  <main class="main">
    <div class="head">
      <div><h1 id="title">Übersicht</h1><p id="subtitle"></p></div>
      <div class="period" id="period"></div>
    </div>
    <div class="msg" id="ebMsg" hidden></div>
    <div id="view"></div>
  </main>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true" aria-labelledby="dTitle">
  <header><h3 id="dTitle">Eintrag</h3><button class="ibtn" id="dClose" aria-label="Schließen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button></header>
  <form id="form" novalidate></form>
  <footer>
    <button class="btn danger" id="dDelete" type="button" hidden>Löschen</button>
    <span class="err" id="dErr"></span>
    <button class="btn primary" id="dSave" type="button">Speichern</button>
  </footer>
</aside>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
  /* ================= Config ================= */
  const FIX_CATS = ["Software & Tools","Marketing & Ads","Team & Freelancer","Büro & Miete","Versicherung","Steuerberatung & Buchhaltung","Bank & Gebühren","Fahrzeug & Reisen","Sonstiges"];
  const INC_CATS = ["Coaching / Career System","Websites & Funnels","Tools & Software","Events","Mixing & Mastering","Sonstiges"];
  const EXP_CATS = ["Marketing & Ads","Freelancer & Produktion","Reise & Events","Hardware & Equipment","Software (einmalig)","Weiterbildung","Bewirtung","Steuern & Abgaben","Sonstiges"];
  const INTERVALS = {monthly:{l:"monatlich",n:1},quarterly:{l:"quartalsweise",n:3},yearly:{l:"jährlich",n:12}};
  const MONTHS = ["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
  const MSHORT = ["Jan","Feb","Mär","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"];
  const eur = new Intl.NumberFormat("de-DE",{style:"currency",currency:"EUR",maximumFractionDigits:0});
  const eur2 = new Intl.NumberFormat("de-DE",{style:"currency",currency:"EUR",minimumFractionDigits:2,maximumFractionDigits:2});
  const kfmt = v => Math.abs(v) >= 1000 ? (v/1000).toLocaleString("de-DE",{maximumFractionDigits:1}) + "k" : Math.round(v).toString();
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const fdate = x => x ? new Date(x).toLocaleDateString("de-DE") : "—";

  const now = new Date();
  const thisMonth = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}`;
  const thisYear = now.getFullYear();
  const addM = (ym, d) => { let [y,m] = ym.split("-").map(Number); m += d; y += Math.floor((m-1)/12); m = ((m-1)%12+12)%12+1; return `${y}-${String(m).padStart(2,"0")}`; };
  const mIdx = ym => { const [y,m] = ym.split("-").map(Number); return y*12 + m-1; };
  const mLabel = ym => { const [y,m] = ym.split("-").map(Number); return `${MONTHS[m-1]} ${y}`; };

  /* ================= State ================= */
  const S = { fix:[], inc:[], exp:[], view:"overview", month:thisMonth, yA:thisYear-1, yB:thisYear, metric:"res", writable:true,
              eb:{paid:{}, open:[], rec:{}, invoiced:{}, dupes:0, dupeAmt:0, fetchedAt:null}, ebSig:null, acc:{} };
  try { const v = localStorage.getItem("clf.view"); if (v) S.view = v; } catch(e){}

  /* ================= Store: shared db, local fallback ================= */
  const COLL = {fix:"fixcosts", inc:"income", exp:"expenses"};
  let store = null;
  function localStore(){
    const key = "clf.local.v1"; let data;
    try { data = JSON.parse(localStorage.getItem(key) || "null"); } catch(e){ data = null; }
    if (!data) data = {};
    const subs = {};
    const list = c => Object.entries(data[c]||{}).map(([id,v]) => ({id,...v}));
    const save = () => { try { localStorage.setItem(key, JSON.stringify(data)); } catch(e){} };
    const emit = c => (subs[c]||[]).forEach(fn => fn(list(c)));
    return { mode:"local",
      sub(c, fn){ (subs[c] ||= []).push(fn); fn(list(c)); },
      async set(c, id, v){ (data[c] ||= {})[id] = v; save(); emit(c); },
      async add(c, v){ const id = Math.random().toString(36).slice(2,10); await this.set(c,id,v); return id; },
      async del(c, id){ delete (data[c]||{})[id]; save(); emit(c); } };
  }
  function dbStore(db){
    return { mode:"db",
      sub(c, fn){ db.collection(c).onSnapshot(s => fn(s.docs.map(d => ({id:d.id, ...d.data()}))), () => {}); },
      set: (c, id, v) => db.collection(c).doc(id).set(v),
      async add(c, v){ const r = await db.collection(c).add(v); return r.id; },
      del: (c, id) => db.collection(c).doc(id).delete() };
  }
  function attach(st){
    store = st;
    st.sub(COLL.fix, d => { S.fix = d; render(); });
    st.sub(COLL.inc, d => { S.inc = d; render(); });
    st.sub(COLL.exp, d => { S.exp = d; render(); });
    st.sub("accounts", d => { S.acc = Object.fromEntries(d.map(x => [x.id, x])); render(); });
    st.sub("easybill", d => {
      const snap = d.find(x => x.id === "snapshot"); if (!snap) return;
      if (S.eb.fetchedAt && snap.fetchedAt <= S.eb.fetchedAt) return;
      S.eb = ebModel(snap); S.ebSig = JSON.stringify([snap.invoices, snap.payments, snap.recurring]);
      if (!ebBusy) ebStatus(mcp ? "ok" : "warn", `Stand ${ebStamp()}`);
      render();
    });
  }

  /* ================= Fixed costs ================= */
  const activeIn = (c, ym) => c.active !== false && (!c.start || c.start <= ym) && (!c.end || c.end >= ym);
  const monthlyEq = c => (Number(c.amount)||0) / (INTERVALS[c.interval]?.n || 1);
  const dueIn = (c, ym) => {
    if (!activeIn(c, ym)) return false;
    const n = INTERVALS[c.interval]?.n || 1; if (n === 1) return true;
    const diff = mIdx(ym) - mIdx(c.start || ym);
    return diff >= 0 && diff % n === 0;
  };

  /* ================= Easybill: actual revenue + forecast ================= */
  // Actual revenue = payments booked on invoices, by payment date, converted to net,
  // capped per invoice at its gross amount (+ dunning fees) so double-booked payments never count twice.
  // Forecast = actual + open invoices (by due date, overdue lands in the current month) + running recurring invoices.
  const EB_SERVER = "Easybill";
  const ebCat = t => /website|webdesign|landing|funnel/i.test(t) ? "Websites & Funnels"
    : /coaching|consulting|training|masterclass|club|mentoring/i.test(t) ? "Coaching / Career System"
    : /instahub|crm|software|tool|abo/i.test(t) ? "Tools & Software (INSTAHUB, CRM …)"
    : /event|gig|booking/i.test(t) ? "Events"
    : /mix|master/i.test(t) ? "Mixing & Mastering" : "Sonstiges";
  const FREQ_MONTHS = {MONTHLY:1, QUARTERLY:3, YEARLY:12};

  function ebModel(snap){
    const M = {paid:{}, open:[], rec:{}, invoiced:{}, dupes:0, dupeAmt:0, fetchedAt:snap?.fetchedAt || null};
    if (!snap?.invoices) return M;
    const inv = new Map(snap.invoices.map(i => [String(i.id), i]));
    const fees = {}, applied = {};
    for (const p of snap.payments || []) if (p.fee) fees[p.doc] = (fees[p.doc]||0) + Math.abs(p.amt);
    const push = (ym, row) => { (M.paid[ym] ||= []).push(row); };
    const pays = [...(snap.payments || [])].filter(p => !p.fee && p.at).sort((a,b) => a.at.localeCompare(b.at));
    for (const p of pays){
      const i = inv.get(String(p.doc)); if (!i || i.cancel) continue;
      const sign = i.type === "CREDIT" ? -1 : 1;
      const cap = Math.abs(i.gross) + (fees[p.doc]||0);
      const room = cap - (applied[p.doc]||0);
      const amt = Math.min(p.amt, room);
      if (p.amt > room){ M.dupes++; M.dupeAmt += (p.amt - Math.max(0, room)) / 100 * (i.gross ? i.net / i.gross : 1); }
      if (amt <= 0) continue;
      applied[p.doc] = (applied[p.doc]||0) + amt;
      const ratio = i.gross ? i.net / i.gross : 1;
      push(p.at.slice(0,7), {no:i.no, cust:i.cust, item:i.item, at:p.at, net: sign * amt / 100 * ratio, gross: sign * amt / 100, cat: ebCat(i.item||"")});
    }
    const today = new Date().toISOString().slice(0,10);
    const staleBefore = new Date(Date.now() - 90 * 864e5).toISOString().slice(0,10); // >90 days overdue: not in forecast
    for (const i of snap.invoices){
      if (i.cancel) continue;
      const sign = i.type === "CREDIT" ? -1 : 1;
      if (i.date) M.invoiced[i.date.slice(0,7)] = (M.invoiced[i.date.slice(0,7)]||0) + sign * i.net / 100;
      const got = applied[i.id] || 0;
      if (i.paidAt && !got){ // marked paid in Easybill without a payment record
        const amt = Math.min(i.paid || i.gross, i.gross);
        push(i.paidAt.slice(0,7), {no:i.no, cust:i.cust, item:i.item, at:i.paidAt, net: sign * amt / 100 * (i.gross ? i.net / i.gross : 1), gross: sign * amt / 100, cat: ebCat(i.item||"")});
        continue;
      }
      if (i.paidAt || i.type === "CREDIT") continue;
      const rest = i.gross - Math.min(got, i.gross);
      if (rest <= 0) continue;
      const ratio = i.gross ? i.net / i.gross : 1;
      const due = i.due || i.date;
      M.open.push({no:i.no, cust:i.cust, item:i.item, date:i.date, due, net: rest / 100 * ratio, gross: rest / 100, partial: got > 0, overdue: due < today, stale: due < staleBefore, cat: ebCat(i.item||"")});
    }
    M.open.sort((a,b) => (a.due||"").localeCompare(b.due||""));
    const horizon = addM(thisMonth, 24);
    for (const r of snap.recurring || []){
      if (r.status !== "RUNNING" || !r.next) continue;
      const step = (FREQ_MONTHS[r.freq] || 1) * (Number(r.interval) || 1);
      const endDate = r.end && /^\d{4}-\d{2}-\d{2}$/.test(r.end) ? r.end : null;
      let left = r.end && /^\d+$/.test(String(r.end)) ? Number(r.end) : Infinity;
      let d = r.next;
      while (left > 0 && d.slice(0,7) <= horizon && (!endDate || d <= endDate)){
        (M.rec[d.slice(0,7)] ||= []).push({cust:r.cust, item:r.item, at:d, net:r.net / 100, gross:r.gross / 100, cat: ebCat(r.item||"")});
        left--; d = addM(d.slice(0,7), step) + d.slice(7);
      }
    }
    return M;
  }

  const sumNet = a => (a || []).reduce((s,x) => s + x.net, 0);
  const openIn = ym => ym === thisMonth ? S.eb.open.filter(o => !o.stale && (o.due||"").slice(0,7) <= ym) : ym > thisMonth ? S.eb.open.filter(o => (o.due||"").slice(0,7) === ym) : [];

  /* One month in numbers. Einnahmen = actually received; Ausgaben = actually due (fixed costs in their billing month + one-off expenses). */
  function month(ym){
    const manual = S.inc.filter(x => x.month === ym).reduce((a,x) => a + (Number(x.amount)||0), 0);
    const inc = sumNet(S.eb.paid[ym]) + manual;
    const fix = S.fix.filter(c => dueIn(c, ym)).reduce((a,c) => a + (Number(c.amount)||0), 0);
    const one = S.exp.filter(x => x.month === ym).reduce((a,x) => a + (Number(x.amount)||0), 0);
    const out = fix + one;
    const fc = ym >= thisMonth ? inc + sumNet(openIn(ym)) + sumNet(S.eb.rec[ym]) : inc;
    return {ym, inc, fix, one, out, res: inc - out, fc};
  }
  const yearMonths = y => Array.from({length:12}, (_,i) => `${y}-${String(i+1).padStart(2,"0")}`);
  const sumM = (ms, k) => ms.reduce((a,m) => a + m[k], 0);

  /* ---- Easybill sync (viewer's own connector) → shared snapshot in db ---- */
  let mcp = null, ebBusy = false;
  function ebStatus(kind, text){ const el = $("#eb"); el.className = "eb " + kind; el.querySelector(".t").textContent = text; }
  function ebMessage(html){ const m = $("#ebMsg"); m.hidden = !html; m.innerHTML = html || ""; }
  const ebStamp = () => S.eb.fetchedAt ? new Date(S.eb.fetchedAt).toLocaleString("de-DE",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}) : null;
  function parsePayload(res){
    let p = res?.payload;
    if (typeof p === "string"){
      const m = /Status:\s*(\d+)/.exec(p);
      if (m && Number(m[1]) >= 400) throw {code:"tool_error", message:p.slice(0,200)};
      const i = p.indexOf("{"); p = JSON.parse(p.slice(i));
    }
    if (!p || !Array.isArray(p.items)) throw {code:"tool_error", message:"Unerwartete Antwort von Easybill"};
    return p;
  }
  async function ebAll(tool, input){
    const out = []; let page = 1, pages = 1;
    do {
      const res = await mcp.callTool(EB_SERVER, tool, {...input, limit:500, page}, {cache:false});
      const p = parsePayload(res); out.push(...p.items); pages = p.pages || 1; page++;
    } while (page <= pages && page <= 20);
    return out;
  }
  const custOf = d => d.customer_snapshot?.display_name || d.customer_snapshot?.company_name || [d.address?.first_name, d.address?.last_name].filter(Boolean).join(" ") || d.address?.company_name || "—";
  const itemOf = d => String(d.items?.[0]?.description || d.title || "").replace(/<[^>]+>/g, "").split(/\r?\n/)[0].trim().slice(0, 60);
  async function ebSync(manual){
    if (!mcp || ebBusy) return;
    ebBusy = true; $("#ebSync").disabled = true; ebStatus("busy", "Easybill · synchronisiere …");
    try {
      const [invs, credits, recs, pays] = await Promise.all([
        ebAll("GetDocuments", {type:"INVOICE", is_draft:"0"}),
        ebAll("GetDocuments", {type:"CREDIT", is_draft:"0"}),
        ebAll("GetDocuments", {type:"RECURRING"}),
        ebAll("GetDocumentPayments", {})
      ]);
      const snap = {
        fetchedAt: new Date().toISOString(),
        invoices: [...invs, ...credits].map(d => ({id:d.id, type:d.type, no:d.number, cust:custOf(d), date:d.document_date, due:d.due_date, gross:d.amount, net:d.amount_net, paid:d.paid_amount, paidAt:d.paid_at, cancel:d.cancel_id, item:itemOf(d)})),
        payments: pays.map(p => ({doc:p.document_id, at:p.payment_at, amt:p.amount, fee:!!p.is_overdue_fee, type:p.type})),
        recurring: recs.map(d => ({id:d.id, cust:custOf(d), gross:d.amount, net:d.amount_net, freq:d.recurring_options?.frequency, interval:d.recurring_options?.interval, next:d.recurring_options?.next_date, end:d.recurring_options?.end_date_or_count, status:d.recurring_options?.status, item:itemOf(d)}))
      };
      const sig = JSON.stringify([snap.invoices, snap.payments, snap.recurring]);
      S.eb = ebModel(snap); render();
      if (sig !== S.ebSig && store){ S.ebSig = sig; try { await store.set("easybill", "snapshot", snap); } catch(e){} }
      ebStatus("ok", `Easybill · ${ebStamp()}`); ebMessage("");
      if (manual) toast("Easybill synchronisiert");
    } catch(e){
      const code = e?.code || "upstream_error";
      const stamp = ebStamp();
      const keep = stamp ? ` Angezeigt wird der letzte Stand vom ${stamp}.` : "";
      if (code === "server_not_connected") { ebStatus("warn", stamp ? `Easybill · Stand ${stamp}` : "Easybill nicht verbunden"); if (!stamp) ebMessage(`<b>Easybill ist für dich nicht verbunden.</b> Füge Easybill in claude.ai unter Einstellungen → Connectors hinzu, dann lädt das Dashboard die Rechnungen automatisch.`); }
      else if (code === "needs_reauth") { ebStatus("err", "Easybill neu verbinden"); ebMessage(`<b>Die Easybill-Verbindung ist abgelaufen.</b> Verbinde Easybill in claude.ai unter Einstellungen → Connectors neu.${keep}`); }
      else if (code === "not_in_manifest" || code === "blocked_by_policy" || code === "approval_required") { ebStatus("warn", "Easybill-Zugriff nicht erlaubt"); ebMessage(`<b>Easybill-Zugriff für diese Seite nicht freigegeben.</b> Erlaube den Zugriff beim nächsten Sync, um echte Umsätze zu laden.${keep}`); }
      else if (code === "selection_required") { ebStatus("warn", "Easybill-Konto wählen"); ebMessage(`<b>Mehrere Easybill-Verbindungen gefunden.</b> Wähle im Hinweis oben das richtige Konto aus.${keep}`); }
      else if (code === "server_unavailable" || code === "rate_limited") { ebStatus("warn", stamp ? `Easybill · Stand ${stamp}` : "Easybill nicht erreichbar"); if (manual) toast("Easybill gerade nicht erreichbar"); }
      else { ebStatus("err", stamp ? `Easybill · Stand ${stamp}` : "Easybill-Fehler"); if (manual) toast("Easybill-Sync fehlgeschlagen: " + (e?.message || code).slice(0, 80)); }
    } finally { ebBusy = false; $("#ebSync").disabled = !mcp; }
  }



  /* ================= Chart: grouped bars ================= */
  function barChart(el, cats, series, {selected, onPick, tip} = {}){
    const W = 760, H = 300, L = 48, R = 8, T = 12, B = 28, n = cats.length;
    const vals = series.flatMap(s => s.values);
    const maxV = Math.max(1, ...vals), minV = Math.min(0, ...vals);
    const step = niceStep((maxV - minV) / 4);
    const top = Math.ceil(maxV / step) * step, bot = Math.floor(minV / step) * step;
    const y = v => T + (top - v) / (top - bot) * (H - T - B);
    const cw = (W - L - R) / n, gap = 2, bw = Math.min(18, (cw * 0.62 - gap) / series.length);
    let g = "";
    for (let v = bot; v <= top + 1e-6; v += step){
      g += `<line class="${Math.abs(v) < 1e-6 ? "zero" : "grid"}" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/>`;
      g += `<text class="tick" x="${L-8}" y="${y(v)+4}" text-anchor="end">${kfmt(v)}</text>`;
    }
    cats.forEach((c, i) => {
      const cx = L + cw * i + cw / 2, x0 = cx - (series.length * bw + (series.length - 1) * gap) / 2;
      series.forEach((s, k) => {
        const v = s.values[i]; if (Math.abs(v) < 0.5) return;
        const x = x0 + k * (bw + gap), y1 = Math.min(y(v), y(0)), y2 = Math.max(y(v), y(0)), h = y2 - y1, r = Math.min(4, h, bw/2);
        g += v >= 0
          ? `<path d="M${x},${y2} V${y1+r} Q${x},${y1} ${x+r},${y1} H${x+bw-r} Q${x+bw},${y1} ${x+bw},${y1+r} V${y2} Z" fill="${s.color}"/>`
          : `<path d="M${x},${y1} V${y2-r} Q${x},${y2} ${x+r},${y2} H${x+bw-r} Q${x+bw},${y2} ${x+bw},${y2-r} V${y1} Z" fill="${s.color}"/>`;
      });
      g += `<text class="tick ${selected === i ? "sel" : ""}" x="${cx}" y="${H-9}" text-anchor="middle">${c}</text>`;
    });
    cats.forEach((c, i) => { g += `<rect class="hit ${selected === i ? "sel" : ""}" data-i="${i}" x="${L + cw*i + 1}" y="${T}" width="${cw-2}" height="${H-T-B}" rx="6"/>`; });
    el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(series.map(s => s.name).join(" und "))} je Monat">${g}</svg><div class="tip"></div>`;
    el.scrollLeft = el.scrollWidth;
    const tipEl = el.querySelector(".tip");
    el.querySelectorAll(".hit").forEach(h => {
      const i = +h.dataset.i;
      h.addEventListener("mouseenter", () => { tipEl.innerHTML = tip(i); tipEl.classList.add("on"); });
      h.addEventListener("mousemove", e => { const r = el.getBoundingClientRect(); let x = e.clientX - r.left + el.scrollLeft + 14; if (x + 220 > r.width + el.scrollLeft) x -= 240; tipEl.style.left = x + "px"; tipEl.style.top = Math.max(0, e.clientY - r.top - 30) + "px"; });
      h.addEventListener("mouseleave", () => tipEl.classList.remove("on"));
      if (onPick) h.addEventListener("click", () => onPick(i));
    });
  }
  function niceStep(raw){ const p = Math.pow(10, Math.floor(Math.log10(raw || 1))); const n = raw / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p; }
  const tipRow = (c, l, v, cls) => `<div class="r"><span>${c ? `<i style="background:${c}"></i>` : ""}${l}</span><b class="${cls||""}">${eur.format(v)}</b></div>`;
  const pctChange = (a, b) => {
    if (!b) return `<span class="pill neutral">–</span>`;
    const p = (a - b) / Math.abs(b) * 100;
    return `<span class="pill ${Math.abs(p) < .5 ? "neutral" : p > 0 ? "good" : "bad"}">${p >= 0 ? "▲" : "▼"} ${Math.abs(p).toLocaleString("de-DE",{maximumFractionDigits:0})} %</span>`;
  };
  const pctCost = (a, b) => {
    if (!b) return `<span class="pill neutral">–</span>`;
    const p = (a - b) / Math.abs(b) * 100;
    return `<span class="pill ${Math.abs(p) < .5 ? "neutral" : p < 0 ? "good" : "bad"}">${p >= 0 ? "▲" : "▼"} ${Math.abs(p).toLocaleString("de-DE",{maximumFractionDigits:0})} %</span>`;
  };

  /* ================= Views ================= */
  const TITLES = {overview:"Übersicht", income:"Einnahmen", expenses:"Ausgaben", compare:"Jahresvergleich"};
  function render(){
    document.querySelectorAll(".nav button").forEach(b => b.setAttribute("aria-current", b.dataset.view === S.view ? "page" : "false"));
    $("#title").textContent = TITLES[S.view];
    if (S.view === "compare") renderCompare(); else { monthPeriod(); ({overview:renderOverview, income:renderIncome, expenses:renderExpenses})[S.view](); }
  }
  function monthPeriod(){
    $("#period").innerHTML = `<div class="stepper" role="group" aria-label="Monat wählen"><button id="prev" aria-label="Vorheriger Monat"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg></button><div class="label">${mLabel(S.month)}</div><button id="next" aria-label="Nächster Monat"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg></button></div>`
      + (S.month !== thisMonth ? `<button class="btn" id="today">Aktueller Monat</button>` : "");
    $("#prev").onclick = () => { S.month = addM(S.month, -1); render(); };
    $("#next").onclick = () => { S.month = addM(S.month, 1); render(); };
    if ($("#today")) $("#today").onclick = () => { S.month = thisMonth; render(); };
  }

  function renderOverview(){
    const ym = S.month, cur = month(ym), prev = month(addM(ym, -1));
    const y = ym.slice(0,4), ytd = yearMonths(y).filter(m => m <= ym).map(month);
    const openSum = sumNet(S.eb.open), od = S.eb.open.filter(o => o.overdue);
    $("#subtitle").textContent = "Einnahmen = tatsächlich bezahlt · Ausgaben = tatsächlich fällig";
    const months = Array.from({length:12}, (_,i) => month(addM(ym, i - 11)));
    $("#view").innerHTML = `
      <section class="kpis">
        <div class="card kpi"><div class="k"><i style="background:var(--s-in)"></i>Einnahmen</div><div class="v">${eur.format(cur.inc)}</div><div class="s">${pctChange(cur.inc, prev.inc)}<span>ggü. Vormonat</span>${cur.fc > cur.inc + .5 ? `<span class="pill neutral" title="inkl. offener Rechnungen und Abo-Rechnungen">Prognose ${eur.format(cur.fc)}</span>` : ""}</div></div>
        <div class="card kpi"><div class="k"><i style="background:var(--s-out)"></i>Ausgaben</div><div class="v">${eur.format(cur.out)}</div><div class="s">${pctCost(cur.out, prev.out)}<span>ggü. Vormonat</span></div></div>
        <div class="card kpi"><div class="k">Ergebnis</div><div class="v ${cur.res >= 0 ? "pos" : "neg"}">${eur.format(cur.res)}</div><div class="s"><span>Marge ${cur.inc ? Math.round(cur.res / cur.inc * 100) + " %" : "—"}</span></div></div>
        <div class="card kpi"><div class="k">Offene Rechnungen</div><div class="v">${eur.format(openSum)}</div><div class="s">${od.length ? `<span class="pill bad">✕ ${od.length} überfällig</span>` : S.eb.fetchedAt ? `<span class="pill good">✓ nichts überfällig</span>` : `<span>noch kein Easybill-Abgleich</span>`}</div></div>
      </section>
      ${accountsPanel(sumM(ytd,"res"), y)}
      <section class="card panel">
        <div class="strip"><span>Seit Jahresbeginn ${y}:</span><span>Einnahmen <b>${eur.format(sumM(ytd,"inc"))}</b></span><span>Ausgaben <b>${eur.format(sumM(ytd,"out"))}</b></span><span>Ergebnis <b class="${sumM(ytd,"res") >= 0 ? "pos" : "neg"}">${eur.format(sumM(ytd,"res"))}</b></span></div>
      </section>
      <section class="card panel">
        <div class="ph"><div><h2>Einnahmen & Ausgaben · 12 Monate</h2><div class="sub">Klick auf einen Monat öffnet ihn</div></div>
          <div class="legend"><span><i style="background:var(--s-in)"></i>Einnahmen</span><span><i style="background:var(--s-out)"></i>Ausgaben</span></div></div>
        <div class="pb"><div class="chart" id="chart"></div></div>
      </section>
      <section class="cols">
        <div class="card panel"><div class="ph"><div><h2>Einnahmen im ${MONTHS[+ym.slice(5)-1]}</h2></div><button class="btn" data-go="income">Alle ansehen</button></div><div class="pb">${incomeList(ym, 6)}</div></div>
        <div class="card panel"><div class="ph"><div><h2>Ausgaben im ${MONTHS[+ym.slice(5)-1]}</h2></div><button class="btn" data-go="expenses">Alle ansehen</button></div><div class="pb">${expenseList(ym, 6)}</div></div>
      </section>`;
    barChart($("#chart"), months.map(m => MSHORT[+m.ym.slice(5)-1] + (m.ym.endsWith("-01") || m === months[0] ? " " + m.ym.slice(2,4) : "")),

       tip:i => { const m = months[i]; return `<div class="t">${mLabel(m.ym)}</div>${tipRow("var(--s-in)","Einnahmen",m.inc)}${tipRow("var(--s-out)","Ausgaben",m.out)}<div style="border-top:1px solid var(--line);margin-top:5px;padding-top:5px">${tipRow(null,"Ergebnis",m.res,m.res >= 0 ? "pos" : "neg")}</div>`; }});

  function wireGo(){ document.querySelectorAll("[data-acc]").forEach(b => b.onclick = () => openAccForm(b.dataset.acc)); document.querySelectorAll("[data-go]").forEach(b => b.onclick = () => go(b.dataset.go)); document.querySelectorAll("[data-add]").forEach(b => b.onclick = () => openForm(b.dataset.add)); document.querySelectorAll("[data-edit]").forEach(b => b.onclick = () => openForm(b.dataset.kind, b.dataset.edit)); }

  function incomeRows(ym){
    const eb = (S.eb.paid[ym] || []).map(x => ({name:x.cust, meta:`Rechnung ${x.no}${x.item ? " · " + x.item : ""}`, date:x.at, amt:x.net, src:"eb"}));

    return [...eb, ...man].sort((a,b) => (b.date||"").localeCompare(a.date||""));
  }
  function expenseRows(ym){
    const fix = S.fix.filter(c => dueIn(c, ym)).map(c => ({name:c.name, meta:`${c.category} · Fixkosten ${INTERVALS[c.interval]?.l || "monatlich"}`, date:`${ym}-${String(c.day||1).padStart(2,"0")}`, amt:Number(c.amount)||0}));
    const one = S.exp.filter(x => x.month === ym).map(x => ({name:x.name, meta:[x.category, x.note].filter(Boolean).join(" · "), date:x.date, amt:Number(x.amount)||0}));

  function incomeList(ym, max){

          <td>${r.src === "man" && S.writable ? `<div class="act"><button class="ibtn" data-kind="inc" data-edit="${r.id}" aria-label="Bearbeiten">${ICON_EDIT}</button></div>` : ""}</td></tr>`).join("")}</tbody>

      <section class="card panel">

          <td>${S.writable ? `<div class="act"><button class="ibtn" data-kind="fix" data-edit="${c.id}" aria-label="Bearbeiten">${ICON_EDIT}</button></div>` : ""}</td></tr>`).join("")}</tbody></table></div>`

          <tr><td><b>${esc(x.name)}</b>${x.note ? `<div class="meta">${esc(x.note)}</div>` : ""}</td><td><span class="tag">${esc(x.category)}</span></td><td>${fdate(x.date)}</td><td class="r"><b>${eur2.format(Number(x.amount)||0)}</b></td>

  function renderCompare(){
    const years = new Set([thisYear, thisYear - 1, thisYear - 2]);
    Object.keys(S.eb.paid).forEach(m => years.add(+m.slice(0,4)));
    S.inc.concat(S.exp).forEach(x => x.month && years.add(+x.month.slice(0,4)));
    S.fix.forEach(c => c.start && years.add(+c.start.slice(0,4)));
    const ys = [...years].sort((a,b) => b - a);
    const opts = v => ys.map(y => `<option ${y === v ? "selected" : ""}>${y}</option>`).join("");
    const METRICS = {inc:"Einnahmen", out:"Ausgaben", res:"Ergebnis"};
    $("#period").innerHTML = `<select class="sel" id="yA" aria-label="Vergleichsjahr">${opts(S.yA)}</select><span style="color:var(--ink-3)">vs.</span><select class="sel" id="yB" aria-label="Jahr">${opts(S.yB)}</select>
      <div class="seg" role="group" aria-label="Kennzahl">${Object.entries(METRICS).map(([k,l]) => `<button data-metric="${k}" aria-pressed="${S.metric === k}">${l}</button>`).join("")}</div>`;
    $("#yA").onchange = e => { S.yA = +e.target.value; render(); };
    $("#yB").onchange = e => { S.yB = +e.target.value; render(); };
    document.querySelectorAll("[data-metric]").forEach(b => b.onclick = () => { S.metric = b.dataset.metric; render(); });

    const A = yearMonths(S.yA).map(month), B = yearMonths(S.yB).map(month);
    // Compare like with like: if a year is still running, only its finished-or-current months count on both sides.
    const lastB = S.yB === thisYear ? +thisMonth.slice(5) : S.yB > thisYear ? 0 : 12;
    const lastA = S.yA === thisYear ? +thisMonth.slice(5) : S.yA > thisYear ? 0 : 12;
    const upto = Math.min(lastA, lastB);
    const partial = upto < 12;
    const tot = (ms, k) => sumM(ms.slice(0, upto), k);
    $("#subtitle").textContent = partial ? `Vergleich Januar bis ${MONTHS[upto-1] || "–"} (gleicher Zeitraum in beiden Jahren)` : `Gesamtjahr ${S.yA} gegen ${S.yB}`;
    const card = (label, k, cost) => { const a = tot(A,k), b = tot(B,k); return `<div class="card kpi"><div class="k">${label} ${S.yB}</div><div class="v ${k === "res" ? (b >= 0 ? "pos" : "neg") : ""}">${eur.format(b)}</div><div class="s">${cost ? pctCost(b, a) : pctChange(b, a)}<span>${S.yA}: ${eur.format(a)}</span></div></div>`; };
    const k = S.metric;
    $("#view").innerHTML = `
      <section class="kpis" style="grid-template-columns:repeat(3,minmax(0,1fr))">${card("Einnahmen","inc")}${card("Ausgaben","out",true)}${card("Ergebnis","res")}</section>
      <section class="card panel">
        <div class="ph"><div><h2>${METRICS[k]} je Monat</h2></div><div class="legend"><span><i style="background:var(--s-out)"></i>${S.yA}</span><span><i style="background:var(--s-in)"></i>${S.yB}</span></div></div>
        <div class="pb"><div class="chart" id="chart"></div></div>
      </section>
      <section class="card panel">
        <div class="ph"><div><h2>Monat für Monat</h2><div class="sub">Netto · Differenz = ${S.yB} minus ${S.yA}</div></div></div>
        <div class="pb"><div class="tbl"><table style="min-width:720px"><thead><tr><th>Monat</th><th class="r">Einnahmen ${S.yA}</th><th class="r">Einnahmen ${S.yB}</th><th class="r">Ausgaben ${S.yA}</th><th class="r">Ausgaben ${S.yB}</th><th class="r">Ergebnis ${S.yA}</th><th class="r">Ergebnis ${S.yB}</th><th class="r">Differenz</th></tr></thead>
          <tbody>${MONTHS.map((mn, i) => { const a = A[i], b = B[i], d = b.res - a.res; return `<tr class="${i >= upto && partial ? "off" : ""}"><td>${mn}</td><td class="r">${eur.format(a.inc)}</td><td class="r">${eur.format(b.inc)}</td><td class="r">${eur.format(a.out)}</td><td class="r">${eur.format(b.out)}</td><td class="r ${a.res >= 0 ? "" : "neg"}">${eur.format(a.res)}</td><td class="r ${b.res >= 0 ? "" : "neg"}">${eur.format(b.res)}</td><td class="r ${d >= 0 ? "pos" : "neg"}">${d >= 0 ? "+" : ""}${eur.format(d)}</td></tr>`; }).join("")}</tbody>
          <tfoot><tr><td>${partial ? `Jan–${MSHORT[upto-1] || "–"}` : "Gesamt"}</td><td class="r">${eur.format(tot(A,"inc"))}</td><td class="r">${eur.format(tot(B,"inc"))}</td><td class="r">${eur.format(tot(A,"out"))}</td><td class="r">${eur.format(tot(B,"out"))}</td><td class="r">${eur.format(tot(A,"res"))}</td><td class="r">${eur.format(tot(B,"res"))}</td><td class="r ${tot(B,"res") - tot(A,"res") >= 0 ? "pos" : "neg"}">${tot(B,"res") - tot(A,"res") >= 0 ? "+" : ""}${eur.format(tot(B,"res") - tot(A,"res"))}</td></tr></tfoot></table></div>
          ${S.yA < 2026 || S.yB < 2026 ? `<p style="font-size:12px;color:var(--ink-3);margin:12px 0 0">Hinweis: Easybill-Daten liegen ab Januar 2026 vor. Einnahmen davor nur, wenn sie manuell erfasst sind.</p>` : ""}</div>
      </section>`;
    barChart($("#chart"), MSHORT, [{name:String(S.yA), color:"var(--s-out)", values:A.map(m => m[k])}, {name:String(S.yB), color:"var(--s-in)", values:B.map(m => m[k])}],
      {tip:i => `<div class="t">${MONTHS[i]}</div>${tipRow("var(--s-out)", String(S.yA), A[i][k])}${tipRow("var(--s-in)", String(S.yB), B[i][k])}`});
  }

  function go(v){ S.view = v; try { localStorage.setItem("clf.view", v); } catch(e){} render(); window.scrollTo(0,0); }

  /* ================= Bank accounts ================= */
  const ACCOUNTS = {main:"Hauptkonto", tax:"Steuerrücklage"};
  function accountsPanel(ytdRes, y){
    const today = new Date().toISOString().slice(0,10);
    const block = id => {
      const a = S.acc[id];
      const btn = S.writable ? `<button class="upd" data-acc="${id}">${a ? "Aktualisieren" : "Eintragen"}</button>` : "";
      if (!a) return `<div class="acc"><div class="k">${ACCOUNTS[id]}${btn}</div><div class="v" style="color:var(--ink-3)">—</div><div class="s">Noch kein Kontostand eingetragen</div></div>`;
      const h = a.history || [], prev = h.length > 1 ? h[h.length - 2] : null;
      const age = Math.round((new Date(today) - new Date(a.date)) / 864e5);
      const diff = prev ? a.amount - prev.amount : null;
      let extra = "";
      if (id === "tax" && ytdRes > 0) extra = `<span>= ${Math.round(a.amount / ytdRes * 100)} % vom Ergebnis ${y}</span>`;
      return `<div class="acc"><div class="k">${ACCOUNTS[id]}${btn}</div><div class="v ${a.amount < 0 ? "neg" : ""}">${eur2.format(a.amount)}</div>
        <div class="s">${age > 14 ? `<span class="pill warn">! Stand ${fdate(a.date)}</span>` : `<span>Stand ${fdate(a.date)}</span>`}
        ${diff !== null && Math.abs(diff) >= 0.01 ? `<span class="pill ${diff > 0 ? "good" : "bad"}">${diff > 0 ? "▲ +" : "▼ "}${eur.format(diff)}</span><span>seit ${fdate(prev.date)}</span>` : ""}${extra}</div></div>`;
    };
    const m = S.acc.main, t = S.acc.tax;
    const total = (m?.amount || 0) + (t?.amount || 0);
    return `<section class="card panel"><div class="accs">${block("main")}${block("tax")}
      <div class="acc total"><div class="k">Liquidität gesamt</div><div class="v ${total < 0 ? "neg" : ""}">${m || t ? eur2.format(total) : "—"}</div>
      <div class="s">${m && t ? `<span>davon frei verfügbar ${eur.format(m.amount)}</span>` : `<span>Hauptkonto + Steuerrücklage</span>`}</div></div></div></section>`;
  }

      $("#dTitle").textContent = (item ? "" : "Neu: ") + (kind === "inc" ? "Einnahme" : "Ausgabe");
      f.innerHTML = `
        <div class="fld"><label for="f_name">${kind === "inc" ? "Kunde / Projekt" : "Bezeichnung"}</label><input id="f_name" value="${esc(x.name||"")}" placeholder="${kind === "inc" ? "z. B. Barzahlung Event" : "z. B. Meta Ads Kampagne"}"></div>
        <div class="two"><div class="fld"><label for="f_amount">Betrag netto (€)</label><input id="f_amount" type="number" step="0.01" min="0" inputmode="decimal" value="${x.amount ?? ""}"></div>
          <div class="fld"><label for="f_date">${kind === "inc" ? "Zahlungsdatum" : "Datum"}</label><input id="f_date" type="date" value="${x.date || d}"></div></div>
        <div class="fld"><label for="f_category">Kategorie</label><select id="f_category">${opt(cats, x.category)}</select></div>
        <div class="fld"><label for="f_note">Notiz</label><input id="f_note" value="${esc(x.note||"")}"></div>
        ${kind === "inc" ? `<p class="hint" style="font-size:12px;color:var(--ink-3);margin:0">Nur für Einnahmen, die nicht über Easybill laufen – bezahlte Easybill-Rechnungen kommen automatisch.</p>` : ""}`;
    }
    $("#drawer").classList.add("on"); $("#scrim").classList.add("on"); $("#drawer").setAttribute("aria-hidden","false");
    setTimeout(() => f.querySelector("input")?.focus(), 60);
  }
  function closeForm(){ $("#drawer").classList.remove("on"); $("#scrim").classList.remove("on"); $("#drawer").setAttribute("aria-hidden","true"); formCtx = null; }
  async function write(fn, msg){
    try { await fn(); toast(msg); return true; }
    catch(e){
      if (e?.code === "invalid_argument" && store.mode === "db"){ S.writable = false; render(); toast("Nur Lesezugriff – Änderungen nicht möglich"); }
      else if (e?.code === "quota_exceeded") toast("Speicher voll – bitte alte Einträge löschen");
      else toast("Nicht gespeichert – bitte erneut versuchen");
      return false;
    }
  }
  async function save(){
    if (!formCtx) return;
    const {kind, id} = formCtx; const v = s => $(s)?.value?.trim();
    if (kind === "acc"){
      const raw = v("#f_amount"); const amount = Number(String(raw||"").replace(",", "."));
      if (raw === "" || !Number.isFinite(amount)) return $("#dErr").textContent = "Kontostand eingeben.";
      if (id === "tax" && amount < 0) return $("#dErr").textContent = "Die Rücklage kann nicht negativ sein.";
      const date = v("#f_date"); if (!date) return $("#dErr").textContent = "Datum fehlt.";
      const prev = S.acc[id] || {};
      const history = [...(prev.history || []), {amount, date}].sort((a,b) => a.date.localeCompare(b.date)).slice(-60);
      const latest = history[history.length - 1];
      const data = {name: ACCOUNTS[id], amount: latest.amount, date: latest.date, history, updatedAt: new Date().toISOString()};
      if (await write(() => store.set("accounts", id, data), "Kontostand gespeichert")) closeForm();
      return;
    }
    const name = v("#f_name"), amount = Number(String(v("#f_amount")||"").replace(",", "."));
    if (!name) return $("#dErr").textContent = "Bezeichnung fehlt.";
    if (!(amount > 0)) return $("#dErr").textContent = "Betrag muss größer 0 sein.";
    let data;
    if (kind === "fix"){
      const end = v("#f_end") || null, start = v("#f_start") || S.month;
      if (end && end < start) return $("#dErr").textContent = "Kündigung liegt vor dem Start.";
      data = {name, amount, interval:v("#f_interval"), category:v("#f_category"), day:Math.min(31, Math.max(1, Number(v("#f_day"))||1)), start, end, note:v("#f_note")||"", active:$("#f_active").checked};
    } else {
      const date = v("#f_date"); if (!date) return $("#dErr").textContent = "Datum fehlt.";
      data = {name, amount, date, month:date.slice(0,7), category:v("#f_category"), note:v("#f_note")||""};
    }
    data.updatedAt = new Date().toISOString();
    if (await write(() => id ? store.set(COLL[kind], id, data) : store.add(COLL[kind], data), id ? "Gespeichert" : "Hinzugefügt")){
      closeForm(); if (kind !== "fix" && data.month !== S.month){ S.month = data.month; render(); }
    }
  }
  async function del(){
    if (!formCtx?.id) return;
    const b = $("#dDelete");
    if (b.dataset.confirm !== "1"){ b.dataset.confirm = "1"; b.textContent = "Wirklich löschen?"; setTimeout(() => { b.dataset.confirm = ""; b.textContent = "Löschen"; }, 3000); return; }
    b.dataset.confirm = ""; b.textContent = "Löschen";
    if (await write(() => store.del(COLL[formCtx.kind], formCtx.id), "Gelöscht")) closeForm();
  }
  let tt; function toast(m){ const t = $("#toast"); t.textContent = m; t.classList.add("on"); clearTimeout(tt); tt = setTimeout(() => t.classList.remove("on"), 2200); }

  /* ================= Wire up ================= */
  document.querySelectorAll(".nav button").forEach(b => b.onclick = () => go(b.dataset.view));
  $("#dClose").onclick = closeForm; $("#scrim").onclick = closeForm;
  $("#dSave").onclick = save; $("#dDelete").onclick = del;
  $("#form").addEventListener("submit", e => { e.preventDefault(); save(); });
  $("#form").addEventListener("keydown", e => { if (e.key === "Enter" && e.target.tagName === "INPUT" && e.target.type !== "checkbox"){ e.preventDefault(); save(); } });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && formCtx) closeForm(); });
  $("#ebSync").onclick = () => ebSync(true);

  render();
  (async () => {
    let db = null;
    try { db = window.claude?.use ? await window.claude.use("db") : null; } catch(e){ db = null; }
    attach(db ? dbStore(db) : localStore());
    try { mcp = window.claude?.use ? await window.claude.use("mcp") : null; } catch(e){ mcp = null; }
    if (!mcp){ $("#ebSync").disabled = true; ebStatus(S.eb.fetchedAt ? "warn" : "err", S.eb.fetchedAt ? `Stand ${ebStamp()}` : "Easybill nicht verfügbar"); return; }
    ebSync(false);
  })();
})();
</script>
